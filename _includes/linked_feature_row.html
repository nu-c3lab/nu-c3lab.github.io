{% assign feature_row = page[include.id] %}

<div class="feature__wrapper feature__wrapper--linked">
  {% for f in feature_row %}
    <div class="feature__item">
      <a class="archive__item linked-feature-tile" href="{{ f.url | relative_url }}">
        {% if f.image_path %}
          <div class="archive__item-teaser">
            <img src="{{ f.image_path | relative_url }}" alt="{{ f.alt | default: '' }}">
          </div>
        {% endif %}

        <div class="archive__item-body">
          {% if f.title %}
            <h2 class="archive__item-title">{{ f.title }}</h2>
          {% endif %}

          {% if f.excerpt %}
            <div class="archive__item-excerpt">{{ f.excerpt | markdownify }}</div>
          {% endif %}
        </div>
      </a>
    </div>
  {% endfor %}
</div>
